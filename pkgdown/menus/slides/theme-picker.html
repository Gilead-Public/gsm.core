<div class="theme-picker hidden" id="theme-picker">
  <label for="theme-select">Theme</label>
  <select id="theme-select" aria-label="Reveal.js theme picker">
    <option value="black">Black</option>
    <option value="white">White</option>
    <option value="league">League</option>
    <option value="night">Night</option>
    <option value="moon">Moon</option>
    <option value="solarized">Solarized</option>
    <option value="dracula">Dracula</option>
    <option value="sky">Sky</option>
    <option value="beige">Beige</option>
    <option value="simple">Simple</option>
    <option value="serif">Serif</option>
    <option value="blood">Blood</option>
  </select>
</div>

<script>
(function () {
  const storageKey = 'intro_gsm_reveal_theme';
  const select = document.getElementById('theme-select');
  const picker = document.getElementById('theme-picker');
  if (!select) return;

  const makeThemeUrl = (theme) => `https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/${theme}.css`;

  const ensureThemeLink = () => {
    let link = document.getElementById('dynamic-reveal-theme');
    if (!link) {
      link = document.createElement('link');
      link.id = 'dynamic-reveal-theme';
      link.rel = 'stylesheet';
      document.head.appendChild(link);
    }
    return link;
  };

  const applyTheme = (theme) => {
    const link = ensureThemeLink();
    link.href = makeThemeUrl(theme);
    window.localStorage.setItem(storageKey, theme);
  };

  const savedTheme = window.localStorage.getItem(storageKey) || 'black';
  if ([...select.options].some((option) => option.value === savedTheme)) {
    select.value = savedTheme;
    applyTheme(savedTheme);
  }

  select.addEventListener('change', (event) => {
    applyTheme(event.target.value);
  });

  document.addEventListener('keydown', (event) => {
    const isT = event.key && event.key.toLowerCase() === 't';
    const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
    if (!isT || isTyping || !picker) return;
    picker.classList.toggle('hidden');
  });
})();
</script>
