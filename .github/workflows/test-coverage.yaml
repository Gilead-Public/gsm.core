# name: test-coverage.yaml
# version: 1.1.0
# Description: Compute test coverage and publish coverage-summary.json artifact
name: test-coverage
on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  # read: Required to download PR test data bundles.
  actions: read
jobs:
  call-test-coverage-core:
    # data-* releases publish test data, not code; skip coverage for them.
    if: >-
      github.event_name != 'release' ||
      !startsWith(github.event.release.tag_name, 'data-')
    uses: gilead-public/gsm.utils/.github/workflows/test-coverage-core.yaml@actions-v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-id: ${{ secrets.CM_BOT_APP_ID }}
      app-private-key: ${{ secrets.CM_BOT_PRIVATE_KEY }}
