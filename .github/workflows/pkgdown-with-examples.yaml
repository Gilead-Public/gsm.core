# gsm.utils GHA version: 0.2.0
# Generated by: https://github.com/Gilead-BioStats/gsm.utils
# Description: Deploy pkgdown site with examples

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

name: pkgdown-examples

jobs:
  pkgdown-examples:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Set Development Mode Env Var
        if: github.ref_name != 'main'
        run: |
          echo "Ref is '${{ github.ref_name }}', setting PKGDOWN_DEV_MODE=devel"
          echo "PKGDOWN_DEV_MODE=devel" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::quarto, local::., Gilead-BioStats/gsm.utils
          needs: website

      - name: Generate examples menu
        shell: Rscript {0}
        run: |
          gsm.utils::add_pkgdown_examples(pkgdown_yml = "_pkgdown.yml")

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Intro Slides
        shell: Rscript {0}
        run: source("inst/examples/slides/render_slides.R")

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Publish slides into docs
        shell: Rscript {0}
        run: |
          dir.create("docs/extra/slides", recursive = TRUE, showWarnings = FALSE)
          slide_assets <- list.files("pkgdown/extra/slides", full.names = TRUE, no.. = TRUE)
          if (length(slide_assets)) {
            file.copy(slide_assets, "docs/extra/slides", recursive = TRUE, overwrite = TRUE)
          }
          articles_index <- "docs/articles/index.html"
          if (file.exists(articles_index)) {
            lines <- readLines(articles_index, warn = FALSE)
            if (!any(grepl("../extra/slides/IntroGsmSlides.html", lines, fixed = TRUE))) {
              insert <- c(
                "      <dt><a href=\"../extra/slides/IntroGsmSlides.html\" target=\"_blank\">Introduction Slides</a></dt>",
                "      <dd><p>Introductory slide deck for {gsm.core}.</p></dd>"
              )
              lines <- sub("</dl>", paste0(paste(insert, collapse = "\\n"), "\\n      </dl>"), lines, fixed = TRUE)
              writeLines(lines, articles_index)
            }
          }

      - name: Deploy PR preview 🧪
        if: github.event_name == 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # Don't clean the whole branch, just the target folder
          clean: false
          branch: gh-pages
          folder: docs
          # Deploy to a subdirectory named after the PR number
          target-folder: pr/${{ github.event.number }}

      - name: PR site URL 🌐
        if: github.event_name == 'pull_request'
        run: |
          echo "🌐 URL: https://gilead-biostats.github.io/${{ github.event.repository.name }}/pr/${{ github.event.number }}/dev"

      - name: Comment with PR site URL 🌐
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const prSiteURL = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr/${context.issue.number}/dev`
            const timestamp = new Date().toISOString();
            const commentBody = `🌐 PR pkgdown deployed: [${prSiteURL}](${prSiteURL})\n\n_Last updated: ${timestamp}_`;
            const commentMarker = '🌐 PR pkgdown deployed:';

            // Get all comments on the PR
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Find existing comment from this bot
            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes(commentMarker)
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            }
      - name: Deploy pkgdown 📃
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
